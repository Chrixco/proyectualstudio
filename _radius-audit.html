<!doctype html><meta charset="utf-8"><title>radius audit</title>
<body style="margin:0">
<div id="frames"></div>
<script>
window.PAGES = ['architecture.html','urban_design.html','about_us.html','contact.html','tools.html','calculator.html','solar-calculator.html','carbon-calculator.html','investment-calculator.html','lead-form.html'];
window.loadAll = async function () {
  const host = document.getElementById('frames');
  const results = {};
  for (const p of window.PAGES) {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:1200px;height:900px;border:0';
    fr.src = '/pages/' + p;
    host.appendChild(fr);
    await new Promise(res => { fr.onload = res; setTimeout(res, 4000); });
    const d = fr.contentDocument;
    const bucket = {};
    for (const el of d.querySelectorAll('button, .btn, a.brutal-btn, .tool-button, img, .form-container, .panel-image, .brutal-card, .brutal-hero, input, textarea, .chart-wrapper, .chart-container, .data-panel')) {
      const r = fr.contentWindow.getComputedStyle(el).borderRadius;
      const kind = el.tagName === 'IMG' ? 'image'
        : /btn|button/i.test(el.className + ' ' + el.tagName) ? 'button'
        : /input|textarea/i.test(el.tagName) ? 'input' : 'panel';
      (bucket[kind] = bucket[kind] || {});
      bucket[kind][r] = (bucket[kind][r] || 0) + 1;
    }
    results[p] = bucket;
    fr.remove();
  }
  return results;
};
</script>
</body>
