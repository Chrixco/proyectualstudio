<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cookie Consent & Analytics -->
  <script src="js/cookie-consent.js"></script>
  <!-- Centralized Color System -->
  <script src="js/colors.js"></script>
  <link rel="icon" href="images/logo03.ico" type="image/x-icon" />
  <title>Proyectual Studio | Arquitectura y Urbanismo | Timber Architecture</title>
  <meta name="description" content="Proyectual Arquitectura y Urbanismo. Timber architecture, sustainable design, arquitectura con madera. Cuenca, Ecuador."/>
  <meta name="keywords" content="proyectual arquitectura, proyectual urbanismo, arquitectura con madera, timber architecture, Cuenca, Ecuador"/>
  <!-- Canonical URL points to main page -->
  <link rel="canonical" href="https://proyectualst.com/main.html"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <link href="css/index.css" rel="stylesheet" />

</head>
<body>
  <video autoplay loop muted playsinline class="position-fixed w-100 h-100 object-fit-cover z-n1">
    <source src="media/Sequence blue.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Pulsing circles -->
  <div class="pulse-circle pulse-1"></div>
  <div class="pulse-circle pulse-2"></div>

  <div class="loader-container brutal-frame-lg">
    <div class="text-center">
      <div id="loader-text" class="loader-text landing-page-title">Proyectual Studio</div>
    </div>
    <h1 class="loader-subtitle landing-page-subtitle" data-en="Architecture and urbanism that thinks of you and the planet." data-es="Arquitectura y urbanismo que piensa en ti y en el planeta.">Architecture and urbanism that thinks of you and the planet.</h1>
    <div class="text-center">
      <div id="enter-text" class="enter-text brutal-btn-yellow brutal-btn-lg">[ Enter Site ]</div>
    </div>
  </div>

  <!-- Language Toggle Button -->
  <div style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
    <button id="lang-toggle" style="padding: 0.6rem 1.2rem; background: var(--index-blue); color: #fff; border: 2px solid var(--index-blue); border-radius: var(--radius-button); cursor: pointer; font-weight: bold; font-family: 'Space Mono', monospace; font-size: 0.9rem; transition: all 0.3s ease;">EN / ES</button>
  </div>

  <footer class="footer text-center py-3">
    © 2025 Christian Corral |
    <a href="mailto:proyectualstudio@gmail.com">
      proyectualstudio@gmail.com
    </a>
  </footer>

  <script>
    const loaderText = document.getElementById('loader-text');
    const enterText = document.getElementById('enter-text');
    const loaderContainer = document.querySelector('.loader-container');

    const revealEnterButton = () => {
      enterText.classList.add('show');
    };

    // Reveal button after fade-in animation completes
    setTimeout(revealEnterButton, 600);

    // Navigate to main page with fade out
    enterText.addEventListener('click', () => {
      document.body.style.transition = 'opacity 0.5s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = "main.html";
      }, 500);
    });

    // Cursor follower effect
    function createCursorFollower() {
      const follower = document.createElement('div');
      follower.style.cssText = `
        position: fixed;
        width: 30px;
        height: 30px;
        border: 3px solid var(--index-blue);
        border-radius: var(--radius-circle);
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.15s ease;
        mix-blend-mode: difference;
      `;
      document.body.appendChild(follower);

      let mouseX = 0, mouseY = 0;
      let followerX = 0, followerY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animate() {
        followerX += (mouseX - followerX) * 0.1;
        followerY += (mouseY - followerY) * 0.1;
        follower.style.left = (followerX - 15) + 'px';
        follower.style.top = (followerY - 15) + 'px';
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Random glitch effect
    function randomGlitch() {
      const glitchChance = Math.random();
      if (glitchChance > 0.97) {
        loaderContainer.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
        setTimeout(() => {
          loaderContainer.style.transform = '';
        }, 50);
      }
    }

    // Initialize effects
    document.addEventListener('DOMContentLoaded', () => {
      createCursorFollower();
      setInterval(randomGlitch, 100);

    });

    // Keyboard shortcut - press Enter to navigate
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && enterText.classList.contains('show')) {
        enterText.click();
      }
    });

    // Language switching
    let currentLang = localStorage.getItem('lang') || 'en';
    const langToggle = document.getElementById('lang-toggle');

    function updateLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);

      document.querySelectorAll('[data-en][data-es]').forEach(el => {
        el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-es');
      });
    }

    langToggle.addEventListener('click', () => {
      const newLang = currentLang === 'en' ? 'es' : 'en';
      updateLanguage(newLang);
    });

    // Initialize language on page load
    updateLanguage(currentLang);

  </script>
</body>
</html>
