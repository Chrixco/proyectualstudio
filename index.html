<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/logo03.jpg" type="image/jpeg" />
  <title>Proyectual Studio – Loading</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />

  <!-- Theme Script (loads early to prevent flash) -->
  <script src="js/theme.js"></script>

  <style>
    body {
      background-color: var(--brutalist-black);
      color: var(--brutalist-white);
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Animated stripes background */
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255, 213, 0, 0.03) 10px,
        rgba(255, 213, 0, 0.03) 20px
      );
      animation: stripeMove 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes stripeMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(20px); }
    }

    .loader-container {
      position: relative;
      z-index: 2;
      padding: 3rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 6px solid var(--brutalist-yellow);
      box-shadow: 12px 12px 0px var(--brutalist-yellow);
      animation: floatContainer 4s ease-in-out infinite;
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(1deg); }
      50% { transform: translateY(0px) rotate(0deg); }
      75% { transform: translateY(-10px) rotate(-1deg); }
    }

    .loader-text {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid var(--brutalist-yellow);
      width: 0;
      animation: typing 2s steps(20, end) forwards, blink 0.75s step-end infinite;
      color: var(--brutalist-yellow);
      text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      0%, 50% { border-color: var(--brutalist-yellow); }
      51%, 100% { border-color: transparent; }
    }

    .loader-sub {
      font-size: clamp(0.9rem, 3vw, 1.3rem);
      margin-top: 2rem;
      padding: 1rem;
      border-top: 3px solid var(--brutalist-yellow);
      border-bottom: 3px solid var(--brutalist-yellow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards 2s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .enter-text {
      display: none;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 900;
      margin-top: 2rem;
      padding: 1rem 2rem;
      cursor: pointer;
      background: var(--brutalist-yellow);
      color: var(--brutalist-black);
      border: 4px solid var(--brutalist-black);
      box-shadow: 6px 6px 0px var(--brutalist-black);
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .enter-text::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--brutalist-white);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .enter-text:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0px var(--brutalist-black);
      color: var(--brutalist-black);
    }

    .enter-text:hover::before {
      left: 0;
    }

    .enter-text:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px var(--brutalist-black);
    }

    .enter-text.show {
      display: inline-block;
      animation: bounceIn 0.6s ease forwards;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Pulsing circles */
    .pulse-circle {
      position: fixed;
      width: 150px;
      height: 150px;
      border: 3px solid var(--brutalist-yellow);
      border-radius: 50%;
      opacity: 0.3;
      animation: pulse 3s ease-in-out infinite;
      z-index: 0;
    }

    .pulse-1 {
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .pulse-2 {
      top: 70%;
      right: 15%;
      animation-delay: 1s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.1;
      }
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--brutalist-white) !important;
      border-top: 3px solid var(--brutalist-yellow);
      z-index: 3;
    }

    footer a {
      color: var(--brutalist-yellow) !important;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    footer a:hover {
      text-decoration: underline;
      color: var(--brutalist-white) !important;
    }
  </style>
</head>
<body>
  <video autoplay loop muted playsinline class="position-fixed w-100 h-100 object-fit-cover z-n1">
    <source src="media/Sequence blue.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Theme Toggle Button (Top Right) -->
  <div style="position: fixed; top: 20px; right: 20px; z-index: 10000;">
    <button id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode"></button>
  </div>

  <!-- Pulsing circles -->
  <div class="pulse-circle pulse-1"></div>
  <div class="pulse-circle pulse-2"></div>

  <div class="loader-container">
    <div class="text-center">
      <div id="loader-text" class="loader-text">Proyectual Studio</div>
    </div>
    <div class="text-center">
      <div class="loader-sub">
        Everyone deserves spaces that respect people and the planet.
      </div>
      <div id="enter-text" class="enter-text">[ Enter Site ]</div>
    </div>
  </div>

  <footer class="footer text-center py-3">
    © 2025 Christian Corral |
    <a href="mailto:christianxcorral@gmail.com">
      christianxcorral@gmail.com
    </a>
  </footer>

  <script>
    const loaderText = document.getElementById('loader-text');
    const enterText = document.getElementById('enter-text');
    const loaderContainer = document.querySelector('.loader-container');

    // Show enter button after typing animation
    loaderText.addEventListener('animationend', (e) => {
      if (e.animationName === 'typing') {
        setTimeout(() => {
          loaderText.style.borderRight = 'none';
          enterText.classList.add('show');
        }, 1000);
      }
    });

    // Navigate to main page with fade out
    enterText.addEventListener('click', () => {
      document.body.style.transition = 'opacity 0.5s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = "main.html";
      }, 500);
    });

    // Cursor follower effect
    function createCursorFollower() {
      const follower = document.createElement('div');
      follower.style.cssText = `
        position: fixed;
        width: 30px;
        height: 30px;
        border: 3px solid var(--brutalist-yellow);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.15s ease;
        mix-blend-mode: difference;
      `;
      document.body.appendChild(follower);

      let mouseX = 0, mouseY = 0;
      let followerX = 0, followerY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animate() {
        followerX += (mouseX - followerX) * 0.1;
        followerY += (mouseY - followerY) * 0.1;
        follower.style.left = (followerX - 15) + 'px';
        follower.style.top = (followerY - 15) + 'px';
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Random glitch effect
    function randomGlitch() {
      const glitchChance = Math.random();
      if (glitchChance > 0.97) {
        loaderContainer.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
        setTimeout(() => {
          loaderContainer.style.transform = '';
        }, 50);
      }
    }

    // Initialize effects
    document.addEventListener('DOMContentLoaded', () => {
      createCursorFollower();
      setInterval(randomGlitch, 100);

    });

    // Keyboard shortcut - press Enter to navigate
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && enterText.classList.contains('show')) {
        enterText.click();
      }
    });

  </script>
</body>
</html>
