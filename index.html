<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cookie Consent & Analytics -->
  <script src="js/cookie-consent.js"></script>
  <link rel="icon" href="images/logo03.ico" type="image/x-icon" />
  <title>Proyectual Studio | Arquitectura y Urbanismo | Timber Architecture</title>
  <meta name="description" content="Proyectual Arquitectura y Urbanismo. Timber architecture, sustainable design, arquitectura con madera. Cuenca, Ecuador."/>
  <meta name="keywords" content="proyectual arquitectura, proyectual urbanismo, arquitectura con madera, timber architecture, Cuenca, Ecuador"/>
  <!-- Canonical URL points to main page -->
  <link rel="canonical" href="https://proyectualst.com/main.html"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />

  <!-- Theme Script (loads early to prevent flash) -->
  <script src="js/theme.js"></script>

  <style>
    body {
      background-color: var(--brutalist-black);
      color: var(--brutalist-white);
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Animated stripes background */
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255, 213, 0, 0.03) 10px,
        rgba(255, 213, 0, 0.03) 20px
      );
      animation: stripeMove 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes stripeMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(20px); }
    }

    .loader-container {
      position: relative;
      z-index: 2;
      padding: 3rem;
      width: min(80vw, 560px);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 6px solid var(--brutalist-yellow);
      border-radius: var(--panel-border-radius);
      box-shadow: 12px 12px 0px var(--brutalist-yellow);
      animation: floatContainer 4s ease-in-out infinite;
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(1deg); }
      50% { transform: translateY(0px) rotate(0deg); }
      75% { transform: translateY(-10px) rotate(-1deg); }
    }

    .loader-text {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid var(--brutalist-yellow);
      width: 0;
      animation: typing 2.5s steps(30, end) forwards, blink 0.75s step-end infinite;
      color: var(--brutalist-yellow);
      text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      0%, 50% { border-color: var(--brutalist-yellow); }
      51%, 100% { border-color: transparent; }
    }

    .loader-subtitle {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--brutalist-white);
      text-align: center;
      margin: 1rem 0;
      padding: 0 1rem;
      border-bottom: none;
      white-space: normal;
      word-wrap: break-word;
      opacity: 0;
      animation: fadeInUp 1s ease forwards 1.5s;
    }

    .loader-subtitle::after {
      display: none;
    }

    .loader-sub {
      font-size: clamp(0.9rem, 3vw, 1.3rem);
      margin-top: 2rem;
      padding: 1rem;
      border-top: 3px solid var(--brutalist-yellow);
      border-bottom: 3px solid var(--brutalist-yellow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards 2s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .enter-text {
      display: none;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 900;
      margin-top: 2rem;
      padding: 1rem 2rem;
      cursor: pointer;
      background: var(--brutalist-yellow);
      color: var(--brutalist-black);
      border: 4px solid var(--brutalist-black);
      box-shadow: 6px 6px 0px var(--brutalist-black);
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      border-radius: var(--panel-border-radius);
    }

    .enter-text::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--brutalist-white);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .enter-text:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0px var(--brutalist-black);
      background: var(--brutalist-black);
      color: #FFFFFF;
      border-color: var(--brutalist-yellow);
    }

    .enter-text:hover::before {
      left: 0;
    }

    .enter-text:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px var(--brutalist-black);
    }

    .enter-text.show {
      display: inline-block;
      animation: bounceIn 0.6s ease forwards;
  }

  @keyframes bounceIn {
    0% {
      opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1);
    }
  }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .loader-container {
        padding: clamp(1.75rem, 8vw, 2.5rem);
        width: min(92vw, 520px);
        border-width: 5px;
        box-shadow: 8px 8px 0px var(--brutalist-yellow);
        margin: 2rem 0;
      }

      .loader-text {
        font-size: clamp(2rem, 9vw, 3.2rem);
        letter-spacing: 2px;
        border-right: none;
        width: 100%;
        white-space: normal;
        animation: none;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
      }

      .loader-subtitle {
        font-size: clamp(1rem, 5vw, 1.5rem);
        letter-spacing: 1px;
        margin: 0.75rem 0;
      }

      .loader-sub {
        font-size: clamp(0.95rem, 4vw, 1.25rem);
        margin-top: 1.5rem;
        padding: 0.9rem;
        line-height: 1.4;
      }

      .enter-text {
        width: 100%;
        max-width: 280px;
        font-size: 1.05rem;
        padding: 0.9rem 1.5rem;
        box-shadow: 5px 5px 0px var(--brutalist-black);
      }

      .pulse-circle {
        width: 110px;
        height: 110px;
        opacity: 0.2;
      }
    }

    @media (max-width: 480px) {
      .loader-container {
        padding: 1.25rem;
        border-width: 4px;
        box-shadow: 6px 6px 0px var(--brutalist-yellow);
      }

      .loader-text {
        font-size: clamp(1.6rem, 9vw, 2.6rem);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
      }

      .loader-subtitle {
        font-size: clamp(0.9rem, 4.5vw, 1.3rem);
        letter-spacing: 0.5px;
        margin: 0.5rem 0;
      }

      .loader-sub {
        padding: 0.75rem;
      }

      .enter-text {
        font-size: 0.95rem;
        padding: 0.75rem 1.25rem;
      }

      .pulse-circle {
        width: 90px;
        height: 90px;
      }
    }

  /* Pulsing circles */
  .pulse-circle {
    position: fixed;
    width: 150px;
    height: 150px;
      border: 3px solid var(--brutalist-yellow);
      border-radius: 50%;
      opacity: 0.3;
      animation: pulse 3s ease-in-out infinite;
      z-index: 0;
    }

    .pulse-1 {
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .pulse-2 {
      top: 70%;
      right: 15%;
      animation-delay: 1s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.1;
      }
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--brutalist-white) !important;
      border-top: 3px solid var(--brutalist-yellow);
      z-index: 3;
    }

    footer a {
      color: var(--brutalist-yellow) !important;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    footer a:hover {
      text-decoration: underline;
      color: var(--brutalist-white) !important;
    }
  </style>
</head>
<body>
  <video autoplay loop muted playsinline class="position-fixed w-100 h-100 object-fit-cover z-n1">
    <source src="media/Sequence blue.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Theme Toggle Button (Top Right) -->
  <div style="position: fixed; top: 20px; right: 20px; z-index: 10000;">
    <button id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode"></button>
  </div>

  <!-- Pulsing circles -->
  <div class="pulse-circle pulse-1"></div>
  <div class="pulse-circle pulse-2"></div>

  <div class="loader-container brutal-frame-lg">
    <div class="text-center">
      <div id="loader-text" class="loader-text brutal-text-yellow">Proyectual Studio</div>
    </div>
    <h1 class="loader-subtitle">architecture and urban design</h1>
    <div class="text-center">
      <div class="loader-sub">
        Everyone deserves spaces that respect people and the planet.
      </div>
      <div id="enter-text" class="enter-text brutal-btn-yellow brutal-btn-lg">[ Enter Site ]</div>
    </div>
  </div>

  <footer class="footer text-center py-3">
    © 2025 Christian Corral |
    <a href="mailto:christianxcorral@gmail.com">
      christianxcorral@gmail.com
    </a>
  </footer>

  <script>
    const loaderText = document.getElementById('loader-text');
    const enterText = document.getElementById('enter-text');
    const loaderContainer = document.querySelector('.loader-container');

    const revealEnterButton = () => {
      loaderText.style.transition = 'border-color 0.3s ease';
      loaderText.style.borderRight = 'none';
      enterText.classList.add('show');
    };

    const animationName = window.getComputedStyle(loaderText).getPropertyValue('animation-name');

    if (animationName === 'none' || animationName.includes('none')) {
      setTimeout(revealEnterButton, 600);
    } else {
      loaderText.addEventListener('animationend', (event) => {
        if (event.animationName === 'typing') {
          setTimeout(revealEnterButton, 1000);
        }
      });
    }

    // Navigate to main page with fade out
    enterText.addEventListener('click', () => {
      document.body.style.transition = 'opacity 0.5s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = "main.html";
      }, 500);
    });

    // Cursor follower effect
    function createCursorFollower() {
      const follower = document.createElement('div');
      follower.style.cssText = `
        position: fixed;
        width: 30px;
        height: 30px;
        border: 3px solid var(--brutalist-yellow);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.15s ease;
        mix-blend-mode: difference;
      `;
      document.body.appendChild(follower);

      let mouseX = 0, mouseY = 0;
      let followerX = 0, followerY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animate() {
        followerX += (mouseX - followerX) * 0.1;
        followerY += (mouseY - followerY) * 0.1;
        follower.style.left = (followerX - 15) + 'px';
        follower.style.top = (followerY - 15) + 'px';
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Random glitch effect
    function randomGlitch() {
      const glitchChance = Math.random();
      if (glitchChance > 0.97) {
        loaderContainer.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
        setTimeout(() => {
          loaderContainer.style.transform = '';
        }, 50);
      }
    }

    // Initialize effects
    document.addEventListener('DOMContentLoaded', () => {
      createCursorFollower();
      setInterval(randomGlitch, 100);

    });

    // Keyboard shortcut - press Enter to navigate
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && enterText.classList.contains('show')) {
        enterText.click();
      }
    });

  </script>
</body>
</html>
