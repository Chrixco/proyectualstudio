<!doctype html><meta charset="utf-8"><body><iframe id=f style="width:1280px;height:900px"></iframe><script>
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(77);const pick=a=>a[Math.floor(R()*a.length)];const between=(lo,hi,st)=>lo+Math.floor(R()*((hi-lo)/st+1))*st;
// Independent reference, from the stated model and the published data
const EEG=k=>{const b=[[10,.077],[40,.0666],[100,.0544]];let lo=0,p=0;for(const[u,r]of b){p+=Math.max(0,Math.min(k,u)-lo)*r;lo=u}return p/Math.min(k,100)};
const ORI={ecuador:[[0,1],[45,.985],[90,.976],[135,.978],[180,.990]],germany:[[0,1],[45,.930],[90,.771],[135,.589],[180,.507]]};
const ori=(m,d)=>{const t=ORI[m];for(let i=0;i<t.length-1;i++){const[a,fa]=t[i],[b,fb]=t[i+1];if(d<=b)return fa+(fb-fa)*(d-a)/(b-a)}};
function reference(p){
  const kwp=p.roof*0.75*p.eff, prod=kwp*p.gtiSum*ori(p.market,p.orient)*(1-p.loss/100);
  const cons=Math.max(0,(p.bill-p.fixed)*12)/p.price;
  const feed=p.market==='germany'?(p.feedAuto?EEG(kwp):p.feedIn):0;
  const val=(q,y)=>{if(p.market==='germany'){const su=Math.min(q,cons*p.self/100);return su*p.price+(q-su)*(y<=20?feed:0)}return Math.min(q,cons)*p.price};
  const cost=kwp*p.cost;let cum=-cost,pay=null,prev=cum;
  for(let y=1;y<=30;y++){let s=val(prod*Math.pow(.995,y-1),y);if(y===15)s-=cost*.15;prev=cum;cum+=s;if(pay===null&&cum>=0)pay=(s>0?y-1+(-prev)/s:y)}
  return {kwp,prod,save:val(prod,1),cost,life:cum,pay,co2:prod*(p.market==='germany'?.344:.4922)};
}
f.onload=()=>setTimeout(()=>{const w=f.contentWindow,d=f.contentDocument,errs=[];w.addEventListener('error',e=>errs.push(e.message));
const el=id=>d.getElementById(id);const num=id=>parseFloat(el(id).textContent.replace(/[^\d.-]/g,''));
const out=[];let pass=0;
// defaults first
const def={};
for(const m of ['ecuador','germany']){w.selectMarket(m);def[m]={city:el('locationSelect').value,prod:el('overviewProduction').textContent,save:el('overviewSavings').textContent,cost:el('overviewTotalCost').textContent,pay:el('overviewPayback').textContent,co2:el('overviewCO2').textContent,note:el('sizingNote').hidden?'':el('sizingNote').textContent,pricePills:[...d.querySelectorAll('#pricePresets .chart-btn')].map(b=>b.textContent+(b.classList.contains('active')?' [on]':'')),selfShown:!el('selfUseSection').hidden,currency:d.querySelector('[data-currency-symbol]').textContent}}
for(let i=1;i<=40;i++){
  const p={};p.market=pick(['ecuador','germany']);w.selectMarket(p.market);
  const sel=el('locationSelect');sel.selectedIndex=Math.floor(R()*sel.options.length);w.updateLocation();
  const city=w.eval('currentCity()');p.gtiSum=city.gti.reduce((a,b)=>a+b,0);
  const effCard=pick([...d.querySelectorAll('[data-efficiency]')]);w.selectOption(effCard,'panelType');p.eff=parseFloat(effCard.dataset.efficiency);
  const set=(id,v)=>{el(id).value=v;return parseFloat(el(id).value)};
  p.roof=set('roofAreaSlider',between(10,500,1));p.orient=set('orientationSlider',between(0,180,1));p.loss=set('lossFactorSlider',between(5,30,1));
  // half the time use a preset pill
  if(R()<0.5){pick([...d.querySelectorAll('#pricePresets .chart-btn')]).click()}else{set('priceSlider',between(p.market==='germany'?0.15:0.05,p.market==='germany'?0.6:0.3,0.005))}
  if(R()<0.5){pick([...d.querySelectorAll('#costPresets .chart-btn')]).click()}else{set('costPerKwSlider',between(p.market==='germany'?700:500,2500,50))}
  p.bill=set('monthlyBillSlider',between(10,500,5));p.fixed=set('fixedChargeSlider',between(0,30,1));p.fixed=Math.min(p.fixed,p.bill);
  p.self=set('selfUseSlider',between(10,80,1));
  p.feedAuto=R()<0.6;if(!p.feedAuto){p.feedIn=set('feedInSlider',between(0,13,0.01))/100;w.onFeedInInput()}else{w.eval('solarState.feedInAuto=true')}
  w.updateDisplay();
  p.price=parseFloat(el('priceSlider').value);p.cost=parseFloat(el('costPerKwSlider').value);
  const ref=reference(p);
  const got={prod:num('overviewProduction'),save:num('overviewSavings'),cost:num('overviewTotalCost'),life:num('overviewThirtyYear'),pay:el('overviewPayback').textContent,co2:num('overviewCO2')};
  const fails=[];
  for(const k of ['prod','save','cost','life','co2']){if(Math.abs(got[k]-ref[k])>Math.max(1,Math.abs(ref[k])*1e-6)+0.5)fails.push(`${k} page ${got[k]} ref ${ref[k].toFixed(1)}`)}
  const refPay=ref.pay===null?null:ref.pay.toFixed(1);const gotPay=/^[\d.]+$/.test(got.pay)?got.pay:null;
  if(refPay!==gotPay)fails.push(`payback page ${got.pay} ref ${refPay}`);
  if(!fails.length)pass++;out.push({i,m:p.market,city:city.name,fails});
}
document.title=JSON.stringify({pass,errs,def,out})},2500);
f.src='/pages/solar-calculator.html';
</script>
