<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentLang = localStorage.getItem('lang') || 'en';

  function updateLanguage(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      el.innerHTML = el.getAttribute(`data-${lang}`);
    });
    const dynamicTitle = document.getElementById('dynamicTitle');
    if (dynamicTitle) {
      dynamicTitle.textContent = lang === 'en' ? 'PlantMe – Climate Mitigation' : 'PlantMe – Mitigación Climática';
    }
    const mainTitle = document.querySelector('h1[data-en]');
    if (mainTitle) {
      mainTitle.textContent = mainTitle.getAttribute(`data-${lang}`);
    }
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.textContent = lang === 'en' ? 'ES' : 'EN';
    }
    localStorage.setItem('lang', lang);
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateLanguage(currentLang);
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        updateLanguage(currentLang);
      });
    }
  });
</script>
