<main class="container py-5 px-3 px-md-4">
  <h1 class="fw-bold text-center mb-5" 
      data-en="Farmacia Las Morlaquitas – Cuenca, Ecuador" 
      data-es="Farmacia Las Morlaquitas – Cuenca, Ecuador">
      Farmacia Las Morlaquitas – Cuenca, Ecuador
  </h1>

  <div class="row">
    <!-- LEFT: TEXT -->
    <div class="col-12 col-lg-7 d-flex flex-column gap-3">
      <div class="border border-2 border-black rounded p-3">
        <p class="project-description mb-0"
           data-en="Farmacia Las Morlaquitas is a neighbourhood pharmacy located in Cuenca, Ecuador. The project combines commercial utility with architectural identity, enhancing its urban corner through material clarity and openness. It provides efficient pharmaceutical services while also acting as a local reference point for community life."
           data-es="La Farmacia Las Morlaquitas es una farmacia de barrio ubicada en Cuenca, Ecuador. El proyecto combina utilidad comercial con identidad arquitectónica, potenciando su esquina urbana mediante claridad material y apertura. Ofrece un servicio farmacéutico eficiente y a la vez funciona como punto de referencia local para la vida comunitaria.">
        </p>
      </div>

      <div class="border border-2 border-black rounded p-3">
        <p class="project-description mb-0"
           data-en="The design balances transparency and enclosure. Glass surfaces connect the pharmacy to the street, while brick and concrete walls provide robustness and climatic comfort. The architectural character is simple yet expressive, emphasising honesty of materials and integration into the local urban fabric."
           data-es="El diseño equilibra transparencia y cerramiento. Las superficies acristaladas conectan la farmacia con la calle, mientras que los muros de ladrillo y hormigón brindan solidez y confort climático. El carácter arquitectónico es sencillo pero expresivo, destacando la honestidad de los materiales y su integración en el tejido urbano local.">
        </p>
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentLang = localStorage.getItem('lang') || 'en';
  function updateLanguage(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute(`data-${lang}`);
    });
    const dynamicTitle = document.getElementById('dynamicTitle');
    if (dynamicTitle) {
      dynamicTitle.textContent = lang === 'en' ? 'Farmacia Las Morlaquitas' : 'Farmacia Las Morlaquitas';
    }
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.textContent = lang === 'en' ? 'ES' : 'EN';
    }
    localStorage.setItem('lang', lang);
  }
  document.addEventListener('DOMContentLoaded', () => {
    updateLanguage(currentLang);
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        updateLanguage(currentLang);
      });
    }
  });
</script>
