<main class="container py-5 px-3 px-md-4">
  <h1 class="fw-bold text-center mb-5" 
      data-en="House of Three Generations" 
      data-es="Casa de Tres Generaciones">Casa de Tres Generaciones</h1>

  <div class="row">
    <!-- Carousel + content left -->
    <div class="col-12 col-lg-7 mb-4 mb-lg-0 d-flex flex-column">
      <div class="d-flex flex-column gap-3">

        <!-- Carousel -->
        <div id="projectCarousel" class="carousel slide mb-3 position-relative overflow-hidden" 
             data-bs-ride="carousel" style="min-height: 480px;">
          <div class="carousel-inner" id="carousel-inner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#projectCarousel" data-bs-slide="prev" 
                  style="top: 50%; transform: translateY(-50%); width: 5%;">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#projectCarousel" data-bs-slide="next" 
                  style="top: 50%; transform: translateY(-50%); width: 5%;">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

        <!-- Description under carousel -->
        <div class="border border-2 border-black rounded p-3">
          <p class="project-description mb-0"
             data-en="Casa de Tres Generaciones is organised around a central courtyard that acts as the heart of family life. The patio, landscaped with trees, flowers, and natural rocks, creates a microclimate and strengthens the connection between interior and exterior spaces. Brick masonry, exposed concrete, and stone define the construction, emphasising robustness and material honesty. Large openings ensure ventilation and daylight, while covered walkways and transitional thresholds mediate between private rooms and communal areas. The project supports intergenerational living by offering independent units connected by the courtyard, where privacy and togetherness coexist."
             data-es="La Casa de Tres Generaciones se organiza en torno a un patio central que actúa como corazón de la vida familiar. El patio, ajardinado con árboles, flores y rocas naturales, genera un microclima y refuerza la relación entre los espacios interiores y exteriores. El ladrillo visto, el hormigón expuesto y la piedra definen la construcción, enfatizando la solidez y la honestidad material. Las amplias aberturas garantizan ventilación e iluminación natural, mientras los corredores cubiertos y umbrales de transición median entre los espacios privados y las áreas comunes. El proyecto favorece la convivencia intergeneracional al ofrecer unidades independientes conectadas por el patio, donde la privacidad y el encuentro se equilibran.">
          </p>
        </div>

        <!-- Extra drawing block -->
        <div class="border border-2 border-black rounded p-3 w-100">
          <img src="../images/casa_ny/Isometrie.png" class="d-block w-100 rounded carousel-img-white" alt="Isometric Drawing" />
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="col-12 col-lg-5 d-flex flex-column gap-3 align-items-start">

      <div class="border border-2 border-black rounded p-3 w-100">
        <img src="../images/casa_ny/210912_PB.png" class="d-block w-100 rounded carousel-img-white" alt="Ground Floor Plan" />
      </div>

      <div class="border border-2 border-black rounded p-3 w-100">
        <img src="../images/casa_ny/210912_P1.png" class="d-block w-100 rounded carousel-img-white" alt="First Floor Plan" />
      </div>

      <div class="border border-2 border-black rounded p-3 w-100">
        <p class="project-description mb-0"
           data-en="Each of the three independent units is carefully articulated around the courtyard, offering autonomy to each generation while preserving the essence of collective life. The design prioritises light, ventilation, and the tactile qualities of local materials."
           data-es="Cada una de las tres unidades independientes está cuidadosamente articulada en torno al patio, ofreciendo autonomía a cada generación y preservando la esencia de la vida colectiva. El diseño prioriza la luz, la ventilación y las cualidades táctiles de los materiales locales.">
        </p>
      </div>

      <div class="border border-2 border-black rounded p-3 w-100">
        <img src="../images/casa_ny/A.01 planta de cubiertas.png" class="d-block w-100 rounded carousel-img-white" alt="Roof Plan" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const carouselInner = document.getElementById('carousel-inner');
  const projectFolder = 'casa_ny';
  const imageDir = `../images/${projectFolder}/`;

  const imageFiles = [
    '01_16 - Photo Large.jpeg',
    '01_17 - Photo Large.jpeg',
    '01_20 - Photo Large.jpeg',
    'casany_01.jpeg'
  ];

  imageFiles.forEach((filename, index) => {
    const isActive = index === 0 ? 'active' : '';
    const item = document.createElement('div');
    item.className = `carousel-item ${isActive}`;
    item.innerHTML = `<img src="${imageDir}${filename}" class="d-block w-100 h-100 object-fit-cover rounded carousel-img" alt="Slide ${index + 1}" />`;
    carouselInner.appendChild(item);
  });

  let currentLang = localStorage.getItem('lang') || 'en';
  function updateLanguage(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute(`data-${lang}`);
    });
    const dynamicTitle = document.getElementById('dynamicTitle');
    if (dynamicTitle) {
      dynamicTitle.textContent = lang === 'en' ? 'House of Three Generations' : 'Casa de Tres Generaciones';
    }
    const mainTitle = document.querySelector('h1[data-en]');
    if (mainTitle) {
      mainTitle.textContent = mainTitle.getAttribute(`data-${lang}`);
    }
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.textContent = lang === 'en' ? 'ES' : 'EN';
    }
    localStorage.setItem('lang', lang);
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateLanguage(currentLang);
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        updateLanguage(currentLang);
      });
    }
  });
</script>
</body>
</html>
