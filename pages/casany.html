        <p class="project-description mb-0"
           data-en="Casa de Tres Generaciones is organised around a central courtyard that acts as the heart of family life. The patio, landscaped with trees, flowers, and natural rocks, creates a microclimate and strengthens the connection between interior and exterior spaces. Brick masonry, exposed concrete, and stone define the construction, emphasising robustness and material honesty. Large openings ensure ventilation and daylight, while covered walkways and transitional thresholds mediate between private rooms and communal areas. The project supports intergenerational living by offering independent units connected by the courtyard, where privacy and togetherness coexist. The architecture merges local construction traditions with contemporary spatial clarity, resulting in a home that is both resilient and rooted in place."
           data-es="La Casa de Tres Generaciones se organiza en torno a un patio central que actúa como corazón de la vida familiar. El patio, ajardinado con árboles, flores y rocas naturales, genera un microclima y refuerza la relación entre los espacios interiores y exteriores. El ladrillo visto, el hormigón expuesto y la piedra definen la construcción, enfatizando la solidez y la honestidad material. Las amplias aberturas garantizan ventilación e iluminación natural, mientras los corredores cubiertos y umbrales de transición median entre los espacios privados y las áreas comunes. El proyecto favorece la convivencia intergeneracional al ofrecer unidades independientes conectadas por el patio, donde la privacidad y el encuentro se equilibran. La arquitectura combina tradiciones constructivas locales con una claridad espacial contemporánea, resultando en una vivienda resiliente y profundamente enraizada en su contexto.">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentLang = localStorage.getItem('lang') || 'en';

  function updateLanguage(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute(`data-${lang}`);
    });
    const dynamicTitle = document.getElementById('dynamicTitle');
    if (dynamicTitle) {
      dynamicTitle.textContent = lang === 'en' ? 'House of Three Generations' : 'Casa de Tres Generaciones';
    }
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.textContent = lang === 'en' ? 'ES' : 'EN';
    }
    localStorage.setItem('lang', lang);
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateLanguage(currentLang);
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        updateLanguage(currentLang);
      });
    }
  });
</script>
