<!doctype html><meta charset="utf-8"><title>button audit</title>
<body style="margin:0"><div id="frames"></div>
<script>
window.auditButtons = async function (pages) {
  const host = document.getElementById('frames');
  const ALLOWED = new Set(['12px', '50%', '999px']);
  const report = [];
  for (const p of pages) {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:1280px;height:900px;border:0';
    fr.src = p;
    host.appendChild(fr);
    await new Promise(res => { fr.onload = res; setTimeout(res, 2500); });
    let d, w;
    try { d = fr.contentDocument; w = fr.contentWindow; } catch (e) { fr.remove(); continue; }
    if (!d || !d.body) { fr.remove(); continue; }
    const els = d.querySelectorAll('button, a.btn, input[type=submit], input[type=button], [class*="btn"], [class*="button"], [role=button], a[onclick], .cta-final, .go-back-btn');
    for (const el of els) {
      const cs = w.getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') continue;
      // a link styled as plain text is not a button
      const paints = cs.backgroundColor !== 'rgba(0, 0, 0, 0)' || cs.borderTopWidth !== '0px';
      if (!paints) continue;
      const r = cs.borderRadius;
      if (ALLOWED.has(r)) continue;
      report.push({page: p.split('/').pop(), radius: r, tag: el.tagName,
                   cls: (el.className || '').toString().slice(0, 60),
                   id: el.id, text: (el.textContent || '').trim().slice(0, 28)});
    }
    fr.remove();
  }
  return report;
};
</script></body>
